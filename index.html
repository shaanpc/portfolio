<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shan pc — Graphic Designer &amp; Visual Storyteller</title>
    <meta
      name="description"
      content="Portfolio of Shan pc — independent graphic designer based in Kozhikode, India, specializing in brand identity, packaging, illustration, ad campaigns, and photo manipulation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/shan-portrait.png" fetchpriority="high" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background-color: #f8f6f1;
        color: #1d1c1a;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background-color: #0c0c0b;
        color: #f1efe9;
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem("shan_pc_theme");
        if (t === "dark" || t === "light") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
